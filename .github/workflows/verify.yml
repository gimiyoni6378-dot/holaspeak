name: Verify HolaSpeak
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix azure-worker
      - run: npm test --prefix azure-worker
      - run: npm run check --prefix azure-worker
      - run: npm ci --prefix functions
      - run: npm test --prefix functions
      - run: npm run test:rules
      - run: npm run build
      - run: npx astryx doctor --built dist
